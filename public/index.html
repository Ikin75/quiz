<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuis Bang Sahat</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="/manifest-player.json" />
    <meta name="theme-color" content="#2b3a67" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div class="quiz-container">
      <div class="header">
        <h1>KUIS BANG SAHAT</h1>
      </div>
      <div id="quiz-content">
        <!-- Soal akan dimuat di sini oleh JavaScript -->
      </div>
      <div id="result" style="display: none">
        <h2>Hasil Akhir</h2>
        <p id="score"></p>
        <button onclick="location.reload()">Ulangi Kuis</button>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("ServiceWorker registered:", registration);
            })
            .catch((error) => {
              console.log("ServiceWorker registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
